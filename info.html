<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>λόγος (LOGOS) — Sobre</title>
  <style>
    :root {
      --bg: #0d0f12;
      --surface: #16191e;
      --text: #e2e4e8;
      --muted: #8b929e;
      --accent: #c5a880;
      --border: #252932;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.7;
      padding: 2rem 1rem;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
    h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.1em; color: var(--accent); }
    .lang-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer;
    }
    .lang-btn:hover { border-color: var(--accent); }
    .subtitle { font-style: italic; color: var(--muted); font-size: 1.1rem; margin-bottom: 1.5rem; }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.2rem; color: var(--accent); margin-bottom: 1rem; font-weight: 500; }
    p, li { color: var(--text); margin-bottom: 0.8rem; font-size: 0.95rem; }
    ul, ol { padding-left: 1.4rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
    .btn {
      text-decoration: none; padding: 0.75rem 1.25rem; border-radius: 8px;
      font-weight: 500; font-size: 0.95rem; transition: 0.2s;
    }
    .btn-primary { background: var(--accent); color: #0d0f12; }
    .btn-secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .hidden { display: none; }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 2rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <p><a href="./">← Abrir a aplicação λόγος (LOGOS)</a></p>
    <div id="content">A carregar informações...</div>
  </div>

    <script src="https://jsdelivr.net"></script>
  <script>
    fetch('https://githubusercontent.com')
      .then(res => res.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(() => {
        document.getElementById('content').innerHTML = 'Erro ao carregar o README.';
      });
  </script>
</body>
</html>
